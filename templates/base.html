{%load static%}
<!DOCTYPE html>
<html>
<head>
    <title>HabitTrakz</title>
    <link rel="stylesheet" href="{% static 'HabitTrakz/style.css' %}">
</head>
<body>

    <h1>HabitTrakz</h1>
    {% if user.is_authenticated %}
    <p>
        Welcome, {{ user.username }} |
        <a href="{% url 'logout' %}">Logout</a>
    </p>
    {% else %}
    <p>
        <a href="{% url 'login' %}">Login</a>
    </p>
    {% endif %}
    {% block content %}
    {% endblock %}

</body>
</html>
